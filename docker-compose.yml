# docker-compose.yml (프로젝트 루트)
services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"      # IntelliJ 에서 localhost:6379 로 붙을 때 필요
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes   # 재시작해도 캐시 유지하려면

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis   # 컨테이너끼리는 서비스명으로 접근
      REDIS_PORT: 6379
    depends_on:
      - redis

volumes:
  redis-data: